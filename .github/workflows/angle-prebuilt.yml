name: ANGLE Prebuilt

on:
  workflow_dispatch:
    inputs:
      angle_ref:
        description: ANGLE branch, tag, or ref to build.
        required: true
        default: main
      angle_commit:
        description: Optional ANGLE commit SHA. Empty builds angle_ref HEAD.
        required: false
        default: ""
      release_tag:
        description: Optional GitHub Release tag override. Empty uses angle-{commitPosition}.
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: angle-prebuilt-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: macos-arm64
            runner: macos-latest
            platform: darwin
            arch: arm64
          - target: windows-x64
            runner: windows-latest
            platform: win32
            arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            platform: win32
            arch: arm64

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: angle

      - name: Preserve CI scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/angle-ci-scripts"
          cp -R "$GITHUB_WORKSPACE/angle/.github/scripts/." "$RUNNER_TEMP/angle-ci-scripts/"
          echo "ANGLE_CI_SCRIPTS=$RUNNER_TEMP/angle-ci-scripts" >> "$GITHUB_ENV"

      - name: Check native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.arch }}"
          case "${RUNNER_OS}" in
            Linux|macOS)
              host_raw="$(uname -m)"
              ;;
            Windows)
              host_raw="${RUNNER_ARCH:-${PROCESSOR_ARCHITEW6432:-${PROCESSOR_ARCHITECTURE:-unknown}}}"
              ;;
            *)
              echo "::error::Unsupported runner OS: ${RUNNER_OS}"
              exit 1
              ;;
          esac

          case "${host_raw}" in
            x86_64|amd64|AMD64|X64)
              host_arch="x64"
              ;;
            arm64|aarch64|ARM64)
              host_arch="arm64"
              ;;
            *)
              echo "::error::Unsupported runner architecture: ${host_raw}"
              exit 1
              ;;
          esac

          echo "Runner OS: ${RUNNER_OS}"
          echo "RUNNER_ARCH: ${RUNNER_ARCH:-}"
          echo "PROCESSOR_ARCHITECTURE: ${PROCESSOR_ARCHITECTURE:-}"
          echo "PROCESSOR_ARCHITEW6432: ${PROCESSOR_ARCHITEW6432:-}"
          echo "Runner architecture: ${host_arch} (${host_raw})"
          echo "Target architecture: ${target}"
          if [[ "${host_arch}" != "${target}" ]]; then
            echo "::error::Native runner architecture ${host_arch} does not match target ${target}"
            exit 1
          fi

      - name: Resolve ANGLE source
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.angle_ref }}"
            requested_commit="${{ inputs.angle_commit }}"
            git remote add chromium https://chromium.googlesource.com/angle/angle.git 2>/dev/null || \
              git remote set-url chromium https://chromium.googlesource.com/angle/angle.git

            head_ref="${ref#refs/heads/}"
            tag_ref="${ref#refs/tags/}"
            if git ls-remote --exit-code --heads chromium "$head_ref" >/dev/null 2>&1; then
              git fetch --depth 1 chromium "refs/heads/$head_ref"
            elif git ls-remote --exit-code --tags chromium "$tag_ref" >/dev/null 2>&1; then
              git fetch --depth 1 chromium "refs/tags/$tag_ref"
            else
              git fetch --depth 1 chromium "$ref"
            fi

            if [[ -n "$requested_commit" ]]; then
              git fetch --depth 1 chromium "$requested_commit" || true
              git checkout --detach "$requested_commit"
            else
              git checkout --detach FETCH_HEAD
            fi
            effective_ref="$ref"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            ref="main"
            git remote add chromium https://chromium.googlesource.com/angle/angle.git 2>/dev/null || \
              git remote set-url chromium https://chromium.googlesource.com/angle/angle.git
            git fetch --depth 1 chromium "refs/heads/$ref"
            git checkout --detach FETCH_HEAD
            effective_ref="$ref"
          else
            effective_ref="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          fi

          resolved_commit="$(git rev-parse HEAD)"
          echo "ANGLE_REF_EFFECTIVE=$effective_ref" >> "$GITHUB_ENV"
          echo "ANGLE_COMMIT_RESOLVED=$resolved_commit" >> "$GITHUB_ENV"
          echo "ANGLE ref: $effective_ref"
          echo "ANGLE commit: $resolved_commit"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            libasound2-dev \
            libdrm-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libpci-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            mesa-common-dev \
            pkg-config \
            xvfb
          if [[ "${{ matrix.platform }}" == "linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | \
              sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
            echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble main" | \
              sudo tee /etc/apt/sources.list.d/llvm-toolchain-noble.list
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              clang-23 \
              libclang-rt-23-dev \
              lld-23 \
              llvm-23
            /usr/lib/llvm-23/bin/clang++ --version
            /usr/lib/llvm-23/bin/llvm-ar --version
            runtime_dir="/usr/lib/llvm-23/lib/clang/23/lib"
            expected_builtins="$runtime_dir/aarch64-unknown-linux-gnu/libclang_rt.builtins.a"
            actual_builtins="$(
              find "$runtime_dir" -maxdepth 3 -type f \
                \( -name 'libclang_rt.builtins-aarch64.a' -o -name 'libclang_rt.builtins-arm64.a' \) \
                | head -n 1
            )"
            find "$runtime_dir" -maxdepth 3 -name 'libclang_rt.builtins*' -print
            if [[ -n "$actual_builtins" && ! -e "$expected_builtins" ]]; then
              sudo mkdir -p "$(dirname "$expected_builtins")"
              sudo ln -sf "$actual_builtins" "$expected_builtins"
            fi
            test -e "$expected_builtins"
          fi

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Configure gclient
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/.gclient" <<'PY'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "checkout_angle_cl_deps": False,
                "checkout_angle_dawn_deps": False,
                "checkout_angle_internal": False,
                "checkout_angle_restricted_traces": False,
              },
            },
          ]
          PY

      - name: Sync ANGLE dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sync_jobs=8
          if [[ "${{ matrix.platform }}" == "win32" && "${{ matrix.arch }}" == "arm64" ]]; then
            sync_jobs=1
            vpython3 "$RUNNER_TEMP/depot_tools/gsutil.py" version || \
              echo "gsutil prewarm returned non-zero; continuing with serialized gclient sync"
          fi
          gclient sync --no-history --shallow --delete_unversioned_trees --reset --jobs "$sync_jobs"
          gclient runhooks

      - name: Patch Windows ARM64 toolchain debugger copy
        if: matrix.platform == 'win32' && matrix.arch == 'arm64'
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/vs_toolchain.py")
          text = path.read_text(encoding="utf-8")
          old = """    target_dir = os.path.join(target_dir, 'win_clang_x64')
              target_cpu = 'x64'
              runtime_dir = x64_runtime
              os.makedirs(target_dir, exist_ok=True)
              _CopyRuntime(target_dir, runtime_dir, target_cpu, debug=False)
              if configuration == 'Debug':
                _CopyRuntime(target_dir, runtime_dir, target_cpu, debug=True)
              _CopyDebugger(target_dir, target_cpu)
          """
          new = """    target_dir = os.path.join(target_dir, 'win_clang_x64')
              target_cpu = 'x64'
              runtime_dir = x64_runtime
              os.makedirs(target_dir, exist_ok=True)
              _CopyRuntime(target_dir, runtime_dir, target_cpu, debug=False)
              if configuration == 'Debug':
                _CopyRuntime(target_dir, runtime_dir, target_cpu, debug=True)
              try:
                _CopyDebugger(target_dir, target_cpu)
              except Exception as e:
                print('Skipping win_clang_x64 debugger DLL copy: %s' % e)
          """
          if old not in text:
            raise SystemExit("Could not locate win_clang_x64 debugger copy block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Generate GN args
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" gn-args \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --output out/Release/args.gn \
            --json-output "$RUNNER_TEMP/gn-args.json"

      - name: Build ANGLE shared libraries
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          echo "ANGLE commit: $ANGLE_COMMIT_RESOLVED"
          echo "GN args:"
          cat "$RUNNER_TEMP/gn-args.json"
          gn gen out/Release
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            autoninja -C out/Release libEGL libGLESv2 copy_compiler_dll
          else
            autoninja -C out/Release libEGL libGLESv2
          fi
          echo "Build output file list:"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" list-outputs --build-dir out/Release

      - name: Package archive
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" package \
            --source-root "$PWD" \
            --build-dir out/Release \
            --artifact-dir "$RUNNER_TEMP/artifacts" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --angle-ref "$ANGLE_REF_EFFECTIVE" \
            --angle-commit "$ANGLE_COMMIT_RESOLVED" \
            --gn-args-json "$RUNNER_TEMP/gn-args.json"
          ls -la "$RUNNER_TEMP/artifacts"

      - name: Verify archive
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/artifacts" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" verify \
            --archive "$archive" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --source-root "$PWD"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error

  macos-universal:
    name: macos-universal
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          path: angle-ci

      - name: Download macOS archives
        uses: actions/download-artifact@v4
        with:
          pattern: angle-darwin-*
          path: mac-artifacts
          merge-multiple: true

      - name: Create and verify universal archive
        shell: bash
        run: |
          set -euo pipefail
          x64_archive="$(find mac-artifacts -maxdepth 1 -name '*-darwin-x64.tar.gz' | head -n 1)"
          arm64_archive="$(find mac-artifacts -maxdepth 1 -name '*-darwin-arm64.tar.gz' | head -n 1)"
          mkdir -p "$RUNNER_TEMP/universal"
          python3 angle-ci/.github/scripts/angle_ci.py universal \
            --x64-archive "$x64_archive" \
            --arm64-archive "$arm64_archive" \
            --artifact-dir "$RUNNER_TEMP/universal"
          universal_archive="$(find "$RUNNER_TEMP/universal" -maxdepth 1 -name '*-darwin-universal.tar.gz' | head -n 1)"
          python3 angle-ci/.github/scripts/angle_ci.py verify \
            --archive "$universal_archive" \
            --platform darwin \
            --arch universal

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-darwin-universal
          path: ${{ runner.temp }}/universal/*
          if-no-files-found: error

  release:
    name: publish-release
    needs:
      - build
      - macos-universal
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: angle-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          explicit_tag="${{ inputs.release_tag }}"
          if [[ -n "$explicit_tag" ]]; then
            tag="$explicit_tag"
          else
            asset="$(find release-assets -maxdepth 1 -type f -name 'angle-*-linux-x64.tar.gz' | head -n 1)"
            if [[ -z "$asset" ]]; then
              echo "::error::Could not find linux-x64 archive for scheduled release tag resolution"
              exit 1
            fi
            name="${asset##*/}"
            if [[ "$name" =~ ^angle-(.+)-linux-x64\.tar\.gz$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo "::error::Unexpected archive name: $name"
              exit 1
            fi
            if [[ "${{ github.event_name }}" == "schedule" && "$version" != main-* ]]; then
              echo "::error::Scheduled release expected main-* version, got $version"
              exit 1
            fi
            tag="angle-$version"
          fi
          echo "Release tag: $tag"
          if [[ -n "$explicit_tag" ]]; then
            echo "RELEASE_TAG_EXPLICIT=1" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG_EXPLICIT=0" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/.github/scripts/angle_ci.py release-notes \
            --artifact-root release-assets \
            --output release-notes.md
          cat release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          cd repo
          git fetch --force origin "+refs/tags/$tag:refs/tags/$tag" || true
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              if [[ "$RELEASE_TAG_EXPLICIT" != "1" ]]; then
                echo "Tag $tag already points to $tag_commit; reusing it for commit-position asset upload"
              else
                echo "::error::Tag $tag points to $tag_commit, not workflow commit $GITHUB_SHA"
                exit 1
              fi
            fi
          fi
          cd ..
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes-file release-notes.md
          fi
