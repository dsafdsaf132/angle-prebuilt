name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build.
        required: true
        type: choice
        options:
          - dev
          - stable
        default: dev
      angle_ref:
        description: Fork branch, tag, or ref to build.
        required: true
        default: main
      angle_commit:
        description: Optional fork commit SHA. Empty builds angle_ref HEAD.
        required: false
        default: ""
      release_tag:
        description: Optional GitHub Release tag override. Empty uses angle-{commitPosition}.
        required: false
        default: ""
      artifact_run_id:
        description: Optional workflow run ID whose angle-* artifacts should be reused for release.
        required: false
        default: ""
  schedule:
    - cron: "0 23 * * *"
  workflow_run:
    workflows:
      - Sync Fork
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      build_ref: ${{ steps.decide.outputs.build_ref }}
      manifest: ${{ steps.decide.outputs.manifest }}
    permissions:
      contents: write
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v7

      - name: Decide whether to build
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ANGLE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.angle_ref || '' }}
          INPUT_ANGLE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.angle_commit || '' }}
          INPUT_ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id || '' }}
          INPUT_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || '' }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          should_build=0
          build_ref=""
          channel="dev"
          manifest='{}'
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            channel="stable"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            channel="${INPUT_CHANNEL:-dev}"
          fi
          if [[ "$channel" == "stable" ]]; then
            manifest="$(python3 "$GITHUB_WORKSPACE/.github/scripts/release_channel.py" resolve-stable)"
            upstream_commit="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["upstreamCommit"])' <<< "$manifest")"
            build_ref="$upstream_commit"
            if [[ "$(python3 "$GITHUB_WORKSPACE/.github/scripts/release_channel.py" has-stable-release --repository "$GITHUB_REPOSITORY" --upstream-commit "$upstream_commit")" == "true" ]]; then
              echo "Stable ANGLE $upstream_commit is already released; skipping"
            else
              should_build=1
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -z "$INPUT_ARTIFACT_RUN_ID" ]]; then
            should_build=1
            requested_ref="${INPUT_ANGLE_COMMIT:-$INPUT_ANGLE_REF}"
            encoded_ref="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$requested_ref")"
            commit_json="$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$encoded_ref")"
            build_ref="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<< "$commit_json")"
            message="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["message"])' <<< "$commit_json")"
            sync_subject="${message%%$'\n'*}"
            recorded_upstream="$(python3 -c 'import re,sys; values=re.findall(r"^Upstream-ANGLE-Commit: ([0-9a-f]{40})$",sys.stdin.read(),re.M); print(values[0] if len(values)==1 else "")' <<< "$message")"
            upstream_parent="$(python3 -c 'import json,sys; parents=json.load(sys.stdin).get("parents", []); print(parents[1]["sha"] if len(parents)>1 else "")' <<< "$commit_json")"
            upstream_commit=""
            if [[ "$sync_subject" == "chore(sync): merge upstream ANGLE "* ]] &&
              git interpret-trailers --parse <<< "$message" | grep -Eq '^Upstream-ANGLE-Commit-Position:[[:space:]]*[0-9]+[[:space:]]*$' &&
              [[ "$recorded_upstream" =~ ^[0-9a-f]{40}$ && "$recorded_upstream" == "$upstream_parent" ]]; then
              upstream_commit="$upstream_parent"
            fi
            if [[ -z "$upstream_commit" ]]; then
              if [[ -n "$INPUT_ANGLE_COMMIT" ]]; then
                echo "::error::Dev release commit is not a valid upstream sync commit"
                exit 1
              fi
              candidate="$build_ref"
              upstream_commit=""
              for _ in {1..50}; do
                commit_json="$(
                  curl -fsSL \
                    --retry 5 \
                    --retry-delay 5 \
                    --retry-all-errors \
                    --connect-timeout 20 \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$candidate"
                )"
                message="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["message"])' <<< "$commit_json")"
                sync_subject="${message%%$'\n'*}"
                recorded_upstream="$(python3 -c 'import re,sys; values=re.findall(r"^Upstream-ANGLE-Commit: ([0-9a-f]{40})$",sys.stdin.read(),re.M); print(values[0] if len(values)==1 else "")' <<< "$message")"
                upstream_parent="$(python3 -c 'import json,sys; parents=json.load(sys.stdin).get("parents", []); print(parents[1]["sha"] if len(parents)>1 else "")' <<< "$commit_json")"
                if [[ "$sync_subject" == "chore(sync): merge upstream ANGLE "* ]] &&
                  git interpret-trailers --parse <<< "$message" | grep -Eq '^Upstream-ANGLE-Commit-Position:[[:space:]]*[0-9]+[[:space:]]*$'; then
                  if [[ "$recorded_upstream" =~ ^[0-9a-f]{40}$ && "$recorded_upstream" == "$upstream_parent" ]]; then
                    build_ref="$candidate"
                    upstream_commit="$upstream_parent"
                    echo "Latest upstream sync commit: $build_ref"
                    break
                  fi
                fi
                candidate="$(python3 -c 'import json,sys; parents=json.load(sys.stdin).get("parents", []); print(parents[0]["sha"] if parents else "")' <<< "$commit_json")"
                if [[ -z "$candidate" ]]; then
                  break
                fi
              done
              if [[ ! "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Could not find a recent upstream sync commit on $requested_ref"
                exit 1
              fi
            fi
            manifest="$(python3 "$GITHUB_WORKSPACE/.github/scripts/release_channel.py" resolve-dev --angle-ref "$requested_ref" --angle-commit "$build_ref" --upstream-commit "$upstream_commit")"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_ARTIFACT_RUN_ID" ]]; then
            echo "Reusing artifacts from run $INPUT_ARTIFACT_RUN_ID; skipping source resolution"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$WORKFLOW_RUN_CONCLUSION" == "success" ]]; then
            target_branch="${WORKFLOW_RUN_HEAD_BRANCH:-main}"
            ref_json="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 5 \
                --retry-all-errors \
                --connect-timeout 20 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$target_branch"
            )"
            branch_head="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])' <<< "$ref_json")"
            if [[ ! "$branch_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Invalid branch HEAD SHA for $target_branch: $branch_head"
              exit 1
            fi
            echo "Workflow run branch: $target_branch"
            echo "Current branch HEAD: $branch_head"
            candidate="$branch_head"
            sync_position=""
            for _ in {1..50}; do
              commit_json="$(
                curl -fsSL \
                  --retry 5 \
                  --retry-delay 5 \
                  --retry-all-errors \
                  --connect-timeout 20 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$candidate"
              )"
              message="$(
                python3 -c 'import json, sys; print(json.load(sys.stdin)["commit"]["message"])' \
                  <<< "$commit_json"
              )"
              sync_subject="${message%%$'\n'*}"
              if [[ "$sync_subject" == "chore(sync): merge upstream ANGLE "* ]] &&
                git interpret-trailers --parse <<< "$message" | grep -Eq '^Upstream-ANGLE-Commit-Position:[[:space:]]*[0-9]+[[:space:]]*$'; then
                recorded_upstream="$(python3 -c 'import re,sys; values=re.findall(r"^Upstream-ANGLE-Commit: ([0-9a-f]{40})$",sys.stdin.read(),re.M); print(values[0] if len(values)==1 else "")' <<< "$message")"
                upstream_parent="$(python3 -c 'import json,sys; parents=json.load(sys.stdin).get("parents", []); print(parents[1]["sha"] if len(parents)>1 else "")' <<< "$commit_json")"
                if [[ "$recorded_upstream" =~ ^[0-9a-f]{40}$ && "$recorded_upstream" == "$upstream_parent" ]]; then
                  build_ref="$candidate"
                  sync_position="$(sed -n 's/^Upstream-ANGLE-Commit-Position:[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' <<< "$message" | head -1)"
                  upstream_commit="$upstream_parent"
                  echo "Latest upstream sync commit: $build_ref"
                  break
                fi
              fi
              candidate="$(
                python3 -c 'import json, sys; parents=json.load(sys.stdin).get("parents", []); print(parents[0]["sha"] if parents else "")' \
                  <<< "$commit_json"
              )"
              if [[ -z "$candidate" ]]; then
                break
              fi
              if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Invalid parent SHA while scanning $target_branch history: $candidate"
                exit 1
              fi
            done
            if [[ -n "$sync_position" ]]; then
              if [[ ! "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Sync commit $build_ref has no valid Upstream-ANGLE-Commit trailer"
                exit 1
              fi
              manifest="$(python3 "$GITHUB_WORKSPACE/.github/scripts/release_channel.py" resolve-dev --angle-ref main --angle-commit "$build_ref" --upstream-commit "$upstream_commit")"
              tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["releaseTag"])' <<< "$manifest")"
              status="$(
                curl -fsS -o /dev/null -w "%{http_code}" \
                  --retry 5 \
                  --retry-delay 5 \
                  --retry-all-errors \
                  --connect-timeout 20 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag" || true
              )"
              if [[ "$status" == "200" ]]; then
                echo "Release $tag already exists; skipping build"
              elif [[ "$status" == "404" ]]; then
                echo "Release $tag is missing; building"
                should_build=1
              else
                echo "::error::Could not check release $tag; HTTP status $status"
                exit 1
              fi
            else
              echo "No recent upstream sync commit found on $target_branch; skipping workflow_run build"
            fi
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          delimiter="ANGLE_MANIFEST_$(openssl rand -hex 8)"
          printf 'manifest<<%s\n%s\n%s\n' "$delimiter" "$manifest" "$delimiter" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs:
      - preflight
    runs-on: ${{ matrix.runner }}
    if: >-
      always() &&
      needs.preflight.outputs.should_build == '1' &&
      inputs.artifact_run_id == ''
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: windows-x64
            runner: windows-2022
            platform: win32
            arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            platform: win32
            arch: arm64

    env:
      DEPOT_TOOLS_UPDATE: "0"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      GYP_MSVS_VERSION: "2022"
      LINUX_ARM64_LLVM_VERSION: "23"
      ANGLE_RELEASE_MANIFEST: ${{ needs.preflight.outputs.manifest }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: angle
          ref: ${{ github.sha }}

      - name: Check out CI helpers
        uses: actions/checkout@v7
        with:
          path: ci
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts

      - name: Preserve CI scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/angle-ci-scripts"
          cp -R "$GITHUB_WORKSPACE/ci/.github/scripts/." "$RUNNER_TEMP/angle-ci-scripts/"
          echo "ANGLE_CI_SCRIPTS=$RUNNER_TEMP/angle-ci-scripts" >> "$GITHUB_ENV"

      - name: Check native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.arch }}"
          case "${RUNNER_OS}" in
            Linux|macOS)
              host_raw="$(uname -m)"
              ;;
            Windows)
              host_raw="${RUNNER_ARCH:-${PROCESSOR_ARCHITEW6432:-${PROCESSOR_ARCHITECTURE:-unknown}}}"
              ;;
            *)
              echo "::error::Unsupported runner OS: ${RUNNER_OS}"
              exit 1
              ;;
          esac

          case "${host_raw}" in
            x86_64|amd64|AMD64|X64)
              host_arch="x64"
              ;;
            arm64|aarch64|ARM64)
              host_arch="arm64"
              ;;
            *)
              echo "::error::Unsupported runner architecture: ${host_raw}"
              exit 1
              ;;
          esac

          echo "Runner OS: ${RUNNER_OS}"
          echo "RUNNER_ARCH: ${RUNNER_ARCH:-}"
          echo "PROCESSOR_ARCHITECTURE: ${PROCESSOR_ARCHITECTURE:-}"
          echo "PROCESSOR_ARCHITEW6432: ${PROCESSOR_ARCHITEW6432:-}"
          echo "Runner architecture: ${host_arch} (${host_raw})"
          echo "Target architecture: ${target}"
          if [[ "${host_arch}" != "${target}" ]]; then
            echo "::error::Native runner architecture ${host_arch} does not match target ${target}"
            exit 1
          fi

      - name: Resolve ANGLE source
        shell: bash
        working-directory: angle
        env:
          ANGLE_BUILD_REF: ${{ needs.preflight.outputs.build_ref }}
        run: |
          set -euo pipefail
          manifest_file="$RUNNER_TEMP/release-manifest.json"
          printf '%s' "$ANGLE_RELEASE_MANIFEST" > "$manifest_file"
          channel="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["channel"])' <<< "$ANGLE_RELEASE_MANIFEST")"
          if [[ "$channel" == "stable" ]]; then
            angle_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["angleCommit"])' <<< "$ANGLE_RELEASE_MANIFEST")"
            git remote add angle-upstream https://chromium.googlesource.com/angle/angle.git 2>/dev/null || true
            git fetch --no-tags angle-upstream "$angle_sha"
            git checkout --detach FETCH_HEAD
            effective_ref="upstream"
          elif [[ "$ANGLE_BUILD_REF" =~ ^[0-9a-f]{40}$ ]]; then
            git checkout --detach "$ANGLE_BUILD_REF"
            effective_ref="${{ inputs.angle_ref || 'main' }}"
          else
            effective_ref="main"
          fi

          resolved_commit="$(git rev-parse HEAD)"
          echo "ANGLE_REF_EFFECTIVE=$effective_ref" >> "$GITHUB_ENV"
          echo "ANGLE_COMMIT_RESOLVED=$resolved_commit" >> "$GITHUB_ENV"
          echo "ANGLE_RELEASE_MANIFEST=$manifest_file" >> "$GITHUB_ENV"
          echo "ANGLE ref: $effective_ref"
          echo "ANGLE commit: $resolved_commit"

      - name: Install Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            g++ \
            libasound2-dev \
            libdrm-dev \
            libglib2.0-dev \
            libgl1-mesa-dev \
            libpci-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            mesa-common-dev \
            pkg-config \
            xvfb
          if [[ "${{ matrix.platform }}" == "linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            llvm_version="$LINUX_ARM64_LLVM_VERSION"
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              https://apt.llvm.org/llvm-snapshot.gpg.key | \
              sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
            echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-$llvm_version main" | \
              sudo tee "/etc/apt/sources.list.d/llvm-toolchain-noble-$llvm_version.list"
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
              "clang-$llvm_version" \
              "libclang-rt-$llvm_version-dev" \
              "lld-$llvm_version" \
              "llvm-$llvm_version"
            "/usr/lib/llvm-$llvm_version/bin/clang++" --version
            "/usr/lib/llvm-$llvm_version/bin/llvm-ar" --version
            runtime_dir="/usr/lib/llvm-$llvm_version/lib/clang/$llvm_version/lib"
            expected_builtins="$runtime_dir/aarch64-unknown-linux-gnu/libclang_rt.builtins.a"
            actual_builtins="$runtime_dir/linux/libclang_rt.builtins-aarch64.a"
            find "$runtime_dir" -maxdepth 3 -name 'libclang_rt.builtins*' -print
            if [[ ! -f "$actual_builtins" ]]; then
              echo "::error::Missing Linux ARM64 clang runtime: $actual_builtins"
              exit 1
            fi
            sudo mkdir -p "$(dirname "$expected_builtins")"
            sudo ln -sfn "$actual_builtins" "$expected_builtins"
            test -e "$expected_builtins"
          fi

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              echo "Attempt $attempt failed: $*"
              sleep $((attempt * 10))
            done
            "$@"
          }
          depot_tools_revision="$(git -C "$GITHUB_WORKSPACE/angle" rev-parse HEAD:third_party/depot_tools)"
          if [[ ! "$depot_tools_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pinned depot_tools revision: $depot_tools_revision"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/depot_tools"
          git -C "$RUNNER_TEMP/depot_tools" init -q
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            git -C "$RUNNER_TEMP/depot_tools" config core.autocrlf false
            git -C "$RUNNER_TEMP/depot_tools" config core.filemode false
          fi
          git -C "$RUNNER_TEMP/depot_tools" remote add origin \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git
          retry git -C "$RUNNER_TEMP/depot_tools" fetch --depth 1 origin "$depot_tools_revision"
          git -C "$RUNNER_TEMP/depot_tools" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/depot_tools" diff --exit-code
          export PATH="$RUNNER_TEMP/depot_tools:$PATH"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "$COMSPEC" //c "$(cygpath -w "$RUNNER_TEMP/depot_tools/bootstrap/win_tools.bat")"
            test -f "$RUNNER_TEMP/depot_tools/git.bat"
          fi
          "$RUNNER_TEMP/depot_tools/ensure_bootstrap"
          test -f "$RUNNER_TEMP/depot_tools/python3_bin_reldir.txt"
          echo "Pinned depot_tools revision: $depot_tools_revision"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Configure gclient
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/.gclient" <<'PY'
          solutions = [
            {
              "name": "angle",
              "url": "https://chromium.googlesource.com/angle/angle.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {
                "checkout_angle_cl_deps": False,
                "checkout_angle_dawn_deps": False,
                "checkout_angle_internal": False,
                "checkout_angle_restricted_traces": False,
              },
            },
          ]
          PY

      - name: Sync ANGLE dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            git config --global core.autocrlf false
            git config --global core.filemode false
            git config --global core.fscache true
            git config --global core.preloadindex true
            git config --global depot-tools.allowGlobalGitConfig false
          fi
          sync_jobs=8
          if [[ "${{ matrix.platform }}" == "win32" && "${{ matrix.arch }}" == "arm64" ]]; then
            sync_jobs=4
            vpython3 "$RUNNER_TEMP/depot_tools/gsutil.py" version || \
              echo "gsutil prewarm returned non-zero; continuing with gclient sync"
          fi
          echo "gclient sync jobs: $sync_jobs"
          for attempt in 1 2 3; do
            if gclient sync --no-history --shallow --delete_unversioned_trees --reset --jobs "$sync_jobs"; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "::error::gclient sync failed after $attempt attempts"
              exit 1
            fi
            echo "gclient sync attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done

      - name: Install upstream Windows SDK
        if: matrix.platform == 'win32'
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" install-windows-sdk \
            --source-root "$PWD" \
            --arch "${{ matrix.arch }}" \
            --download-dir "$RUNNER_TEMP/windows-sdk-installer"

      - name: Prepare hosted Windows toolchain
        if: matrix.platform == 'win32'
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" prepare-windows-toolchain \
            --source-root "$PWD" \
            --arch "${{ matrix.arch }}"

      - name: Generate GN args
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" gn-args \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --clang-version "$LINUX_ARM64_LLVM_VERSION" \
            --output out/Release/args.gn \
            --json-output "$RUNNER_TEMP/gn-args.json"

      - name: Build ANGLE shared libraries
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          echo "ANGLE commit: $ANGLE_COMMIT_RESOLVED"
          echo "GN args:"
          cat "$RUNNER_TEMP/gn-args.json"
          gn gen out/Release
          if [[ "${{ matrix.platform }}" == "win32" && "${{ matrix.arch }}" == "arm64" ]]; then
            processor_count="${NUMBER_OF_PROCESSORS:-}"
            if [[ ! "$processor_count" =~ ^[0-9]+$ || "$processor_count" -lt 1 ]]; then
              processor_count="$(python3 -c "import os; print(os.cpu_count() or 4)")"
            fi
            jobs=$((processor_count * 2))
            if [[ "$jobs" -gt 12 ]]; then
              jobs=12
            fi
            echo "Windows ARM64 ninja jobs: $jobs (processors: $processor_count)"
            autoninja -C out/Release -j "$jobs" libEGL libGLESv2 copy_compiler_dll
          elif [[ "${{ matrix.platform }}" == "win32" ]]; then
            autoninja -C out/Release libEGL libGLESv2 copy_compiler_dll
          else
            autoninja -C out/Release libEGL libGLESv2
          fi
          echo "Build output file list:"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" list-outputs --build-dir out/Release

      - name: Package archive
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" package \
            --source-root "$PWD" \
            --build-dir out/Release \
            --artifact-dir "$RUNNER_TEMP/artifacts" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --angle-ref "$ANGLE_REF_EFFECTIVE" \
            --angle-commit "$ANGLE_COMMIT_RESOLVED" \
            --gn-args-json "$RUNNER_TEMP/gn-args.json" \
            --release-manifest "$ANGLE_RELEASE_MANIFEST"
          ls -la "$RUNNER_TEMP/artifacts"

      - name: Verify archive layout and dependencies
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r archive; do
            archives+=("$archive")
          done < <(find "$RUNNER_TEMP/artifacts" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one archive in $RUNNER_TEMP/artifacts, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" verify \
            --archive "$archive" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --source-root "$PWD" \
            --skip-smoke

      - name: Run smoke test
        if: ${{ matrix.platform != 'darwin' || matrix.arch != 'x64' }}
        shell: bash
        working-directory: angle
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r archive; do
            archives+=("$archive")
          done < <(find "$RUNNER_TEMP/artifacts" -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one archive in $RUNNER_TEMP/artifacts, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          python3 "$ANGLE_CI_SCRIPTS/angle_ci.py" smoke \
            --archive "$archive" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}"

      - name: Skip macOS x64 smoke test
        if: ${{ matrix.platform == 'darwin' && matrix.arch == 'x64' }}
        shell: bash
        run: |
          echo "Skipping runtime smoke for macOS x64 hosted Intel runner"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: angle-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error

  macos_universal:
    name: macos-universal
    needs:
      - build
    runs-on: macos-15
    if: >-
      needs.build.result == 'success'
    timeout-minutes: 60
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Download macOS x64 archive
        uses: actions/download-artifact@v8
        with:
          name: angle-darwin-x64
          path: ${{ runner.temp }}/universal-input/x64

      - name: Download macOS arm64 archive
        uses: actions/download-artifact@v8
        with:
          name: angle-darwin-arm64
          path: ${{ runner.temp }}/universal-input/arm64

      - name: Create macOS universal archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          x64_archives=()
          while IFS= read -r archive; do
            x64_archives+=("$archive")
          done < <(find "$RUNNER_TEMP/universal-input/x64" -maxdepth 1 -type f -name '*.tar.gz' | sort)
          if [[ "${#x64_archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one macOS x64 archive, found ${#x64_archives[@]}"
            printf '%s\n' "${x64_archives[@]}"
            exit 1
          fi
          arm64_archives=()
          while IFS= read -r archive; do
            arm64_archives+=("$archive")
          done < <(find "$RUNNER_TEMP/universal-input/arm64" -maxdepth 1 -type f -name '*.tar.gz' | sort)
          if [[ "${#arm64_archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one macOS arm64 archive, found ${#arm64_archives[@]}"
            printf '%s\n' "${arm64_archives[@]}"
            exit 1
          fi
          x64_archive="${x64_archives[0]}"
          arm64_archive="${arm64_archives[0]}"
          python3 repo/.github/scripts/angle_ci.py universal \
            --x64-archive "$x64_archive" \
            --arm64-archive "$arm64_archive" \
            --artifact-dir "$RUNNER_TEMP/artifacts"
          ls -la "$RUNNER_TEMP/artifacts"

      - name: Verify macOS universal archive
        shell: bash
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r archive; do
            archives+=("$archive")
          done < <(find "$RUNNER_TEMP/artifacts" -maxdepth 1 -type f -name '*.tar.gz' | sort)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one universal archive in $RUNNER_TEMP/artifacts, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          python3 repo/.github/scripts/angle_ci.py verify \
            --archive "$archive" \
            --platform darwin \
            --arch universal \
            --skip-smoke

      - name: Skip macOS universal smoke test
        shell: bash
        run: |
          echo "Skipping runtime smoke for macOS universal archive"

      - name: Upload macOS universal archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: angle-darwin-universal
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error

  release:
    name: publish-release
    needs:
      - preflight
      - build
      - macos_universal
    runs-on: ubuntu-24.04
    if: >-
      always() &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.artifact_run_id != ''
        ) ||
        (
          needs.build.result == 'success' &&
          needs.macos_universal.result == 'success'
        )
      )
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: repo
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Show artifact source
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
        run: |
          set -euo pipefail
          echo "Artifact run ID: $ARTIFACT_RUN_ID"

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: angle-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Validate release assets
        id: assets
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ needs.preflight.outputs.manifest }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("channel", ""))' <<< "$RELEASE_MANIFEST")" != "" ]]; then
            printf '%s' "$RELEASE_MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
            args+=(--release-manifest "$RUNNER_TEMP/release-manifest.json")
          fi
          python3 repo/.github/scripts/angle_ci.py validate-release-assets \
            --artifact-root release-assets \
            "${args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve release target
        shell: bash
        env:
          ARTIFACT_COMMIT: ${{ steps.assets.outputs.angle_commit }}
          ARTIFACT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != '' && inputs.artifact_run_id || '' }}
          INPUT_ANGLE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.angle_commit || '' }}
          PREFLIGHT_BUILD_REF: ${{ needs.preflight.outputs.build_ref }}
          RELEASE_MANIFEST: ${{ needs.preflight.outputs.manifest }}
        run: |
          set -euo pipefail
          manifest_channel="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("channel", ""))' <<< "$RELEASE_MANIFEST")"
          target_sha="$ARTIFACT_COMMIT"
          if [[ -n "$manifest_channel" ]]; then
            target_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tagCommit"])' <<< "$RELEASE_MANIFEST")"
            manifest_angle="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["angleCommit"])' <<< "$RELEASE_MANIFEST")"
            if [[ "$manifest_angle" != "$ARTIFACT_COMMIT" ]]; then
              echo "::error::Release manifest source $manifest_angle differs from archive source $ARTIFACT_COMMIT"
              exit 1
            fi
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid ANGLE commit in release assets: $target_sha"
            exit 1
          fi
          if [[ -n "$INPUT_ANGLE_COMMIT" ]]; then
            if [[ ! "$INPUT_ANGLE_COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::Invalid requested ANGLE commit: $INPUT_ANGLE_COMMIT"
              exit 1
            fi
            if [[ "$ARTIFACT_COMMIT" != "$INPUT_ANGLE_COMMIT"* ]]; then
              echo "::error::Release assets were built from $ARTIFACT_COMMIT, requested $INPUT_ANGLE_COMMIT"
              exit 1
            fi
          fi
          if [[ -z "$ARTIFACT_RUN_ID" && -z "$manifest_channel" && "$PREFLIGHT_BUILD_REF" != "$target_sha" ]]; then
            echo "::error::Release assets were built from $target_sha, expected $PREFLIGHT_BUILD_REF"
            exit 1
          fi
          if ! git -C repo cat-file -e "$target_sha^{commit}" 2>/dev/null; then
            git -C repo fetch --no-tags origin "$target_sha"
          fi
          git -C repo cat-file -e "$target_sha^{commit}"
          echo "Release target: $target_sha"
          echo "RELEASE_TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: Resolve release tag
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ needs.preflight.outputs.manifest }}
        run: |
          set -euo pipefail
          manifest_channel="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("channel", ""))' <<< "$RELEASE_MANIFEST")"
          if [[ -n "$manifest_channel" ]]; then
            tag="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["releaseTag"])' <<< "$RELEASE_MANIFEST")"
            title="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["releaseTitle"])' <<< "$RELEASE_MANIFEST")"
            echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"
            echo "RELEASE_CHANNEL=$manifest_channel" >> "$GITHUB_ENV"
            printf '%s' "$RELEASE_MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
            echo "RELEASE_MANIFEST_PATH=$RUNNER_TEMP/release-manifest.json" >> "$GITHUB_ENV"
            echo "RELEASE_TAG_EXPLICIT=0" >> "$GITHUB_ENV"
          else
            explicit_tag="${{ inputs.release_tag }}"
            if [[ -n "$explicit_tag" ]]; then
              tag="$explicit_tag"
            else
            assets=()
            while IFS= read -r asset; do
              assets+=("$asset")
            done < <(find release-assets -maxdepth 1 -type f -name 'angle-*-linux-x64.tar.gz' | sort)
            if [[ "${#assets[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one linux-x64 archive for scheduled release tag resolution, found ${#assets[@]}"
              printf '%s\n' "${assets[@]}"
              exit 1
            fi
            asset="${assets[0]}"
            name="${asset##*/}"
            if [[ "$name" =~ ^angle-(.+)-linux-x64\.tar\.gz$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              echo "::error::Unexpected archive name: $name"
              exit 1
            fi
            tag="angle-$version"
            fi
            echo "RELEASE_TITLE=$tag" >> "$GITHUB_ENV"
            echo "RELEASE_CHANNEL=dev" >> "$GITHUB_ENV"
            echo "RELEASE_TAG_EXPLICIT=$([[ -n "$explicit_tag" ]] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          fi
          echo "Release tag: $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_MANIFEST_PATH:-}" ]]; then
            python3 repo/.github/scripts/release_channel.py release-notes \
              --manifest "$RELEASE_MANIFEST_PATH" \
              --artifact-root release-assets \
              --output release-notes.md
          else
            python3 repo/.github/scripts/angle_ci.py release-notes \
              --artifact-root release-assets \
              --output release-notes.md
          fi
          cat release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < <(find release-assets -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -ne 7 ]]; then
            echo "::error::Expected exactly 7 release assets; found ${#assets[@]}"
            exit 1
          fi
          git -C repo fetch --no-tags origin "$RELEASE_TARGET_SHA"
          git -C repo cat-file -e "$RELEASE_TARGET_SHA^{commit}"
          git -C repo fetch origin "+refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
          tag_commit=""
          if git -C repo rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            tag_commit="$(git -C repo rev-parse "refs/tags/$tag^{commit}")"
            if [[ "$tag_commit" != "$RELEASE_TARGET_SHA" ]]; then
              echo "::error::Tag $tag points to $tag_commit; expected $RELEASE_TARGET_SHA"
              exit 1
            fi
          fi
          lookup_release() {
            local release_json_path="$RUNNER_TEMP/existing-release.json"
            local release_status
            if ! release_status="$(curl -sS \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$release_json_path" \
              -w "%{http_code}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")"; then
              echo "::error::Could not check release $tag" >&2
              return 1
            fi
            if [[ "$release_status" == "200" ]]; then
              local release_json
              if ! release_json="$(python3 -c 'import json,sys; release=json.load(sys.stdin); assert isinstance(release,dict); print(json.dumps(release))' < "$release_json_path")"; then
                echo "::error::Could not parse release response while checking $tag" >&2
                return 1
              fi
              printf '%s' "$release_json"
              return
            fi
            if [[ "$release_status" != "404" ]]; then
              echo "::error::Could not check release $tag; HTTP status $release_status" >&2
              return 1
            fi

            local release_list_path="$RUNNER_TEMP/releases.json"
            local release_page=1
            local release_json=""
            local release_list_status
            local release_count
            while true; do
              if ! release_list_status="$(curl -sS \
                --retry 5 \
                --retry-delay 5 \
                --retry-all-errors \
                --connect-timeout 20 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -o "$release_list_path" \
                -w "%{http_code}" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$release_page")"; then
                echo "::error::Could not list releases while checking $tag" >&2
                return 1
              fi
              if [[ "$release_list_status" != "200" ]]; then
                echo "::error::Could not list releases while checking $tag; HTTP status $release_list_status" >&2
                return 1
              fi
              if ! release_json="$(python3 -c 'import json,sys; releases=json.load(sys.stdin); assert isinstance(releases,list); match=next((release for release in releases if release.get("tag_name")==sys.argv[1]), None); print(json.dumps(match) if match else "")' "$tag" < "$release_list_path")"; then
                echo "::error::Could not parse release list while checking $tag" >&2
                return 1
              fi
              if ! release_count="$(python3 -c 'import json,sys; releases=json.load(sys.stdin); assert isinstance(releases,list); print(len(releases))' < "$release_list_path")"; then
                echo "::error::Could not parse release count while checking $tag" >&2
                return 1
              fi
              if [[ ! "$release_count" =~ ^[0-9]+$ ]]; then
                echo "::error::Invalid release count while checking $tag: $release_count" >&2
                return 1
              fi
              if [[ -n "$release_json" ]] || (( release_count < 100 )); then
                break
              fi
              release_page=$((release_page + 1))
            done
            printf '%s' "$release_json"
          }
          release_json="$(lookup_release)"
          ensure_release_tag() {
            if [[ -z "$tag_commit" ]]; then
              git -C repo tag "$tag" "$RELEASE_TARGET_SHA"
              git -C repo push origin "refs/tags/$tag"
              tag_commit="$RELEASE_TARGET_SHA"
            fi
          }
          release_manifests_match() {
            printf '%s' "$release_json" > "$RUNNER_TEMP/release-to-compare.json"
            [[ "$(python3 repo/.github/scripts/release_channel.py release-manifests-match \
              --release-json "$RUNNER_TEMP/release-to-compare.json" \
              --manifest "$RELEASE_MANIFEST_PATH")" == "true" ]]
          }
          if [[ -n "$release_json" ]]; then
            if [[ -z "$tag_commit" ]]; then
              release_target="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("target_commitish", ""))' <<< "$release_json")"
              if [[ "$release_target" != "$RELEASE_TARGET_SHA" ]]; then
                echo "::error::Release $tag targets $release_target; expected $RELEASE_TARGET_SHA"
                exit 1
              fi
            fi
            is_draft="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["draft"]).lower())' <<< "$release_json")"
            if [[ "$is_draft" != "true" ]]; then
              if [[ -z "${RELEASE_MANIFEST_PATH:-}" ]]; then
                echo "::error::Release $tag is already public; refusing to replace its assets"
                exit 1
              fi
              if ! release_manifests_match; then
                echo "::error::Published release $tag has different source provenance"
                exit 1
              fi
              python3 -c 'import json,sys; r=json.load(sys.stdin); expected=sorted(x.split("/",1)[-1] for x in sys.argv[1:]); actual=sorted(a["name"] for a in r.get("assets",[])); assert len(actual)==7 and actual==expected, f"published release asset mismatch: {actual!r}"' "${assets[@]}" <<< "$release_json"
              ensure_release_tag
              echo "Release $tag is already published with matching provenance and assets; no changes made"
              exit 0
            fi
            if [[ -n "${RELEASE_MANIFEST_PATH:-}" ]]; then
              if ! release_manifests_match; then
                echo "::error::Existing draft $tag has different source provenance; refusing to reuse it"
                exit 1
              fi
            fi
            ensure_release_tag
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ -n "${RELEASE_MANIFEST_PATH:-}" ]]; then
              gh release edit "$tag" --title "$RELEASE_TITLE" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
            fi
          else
            ensure_release_tag
            create_args=("$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md --draft)
            if [[ "$RELEASE_CHANNEL" == "dev" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

          release_json="$(lookup_release)"
          python3 -c 'import json,sys; r=json.load(sys.stdin); expected=sorted(x.split("/",1)[-1] for x in sys.argv[1:]); actual=sorted(a["name"] for a in r.get("assets",[])); assert len(actual)==7 and actual==expected, f"release asset mismatch: {actual!r}"' "${assets[@]}" <<< "$release_json"
          if [[ -z "$tag_commit" ]]; then
            git -C repo fetch origin "+refs/tags/$tag:refs/tags/$tag"
            tag_commit="$(git -C repo rev-parse "refs/tags/$tag^{commit}")"
          fi
          if [[ "$tag_commit" != "$RELEASE_TARGET_SHA" ]]; then
            echo "::error::Published tag $tag points to $tag_commit, not $RELEASE_TARGET_SHA"
            exit 1
          fi
          publish_args=(--draft=false --repo "$GITHUB_REPOSITORY")
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            publish_args+=(--latest --prerelease=false)
          else
            publish_args+=(--prerelease)
          fi
          gh release edit "$tag" "${publish_args[@]}"
          release_json="$(lookup_release)"
          python3 -c 'import json,sys; r=json.load(sys.stdin); assert not r["draft"]; assert r["prerelease"] == (sys.argv[1] == "dev")' "$RELEASE_CHANNEL" <<< "$release_json"
